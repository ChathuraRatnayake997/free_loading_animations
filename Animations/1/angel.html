<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel Loader</title>
    <link rel="stylesheet" href="angel.css">
</head>
<body>
    <div class="angel-wrapper">
        <div class="angel-aspect">
            <div class="angel-wing angel-w1" style="--rz: 0deg;"></div>
            <div class="angel-wing angel-w2" style="--rz: 60deg;"></div>
            <div class="angel-wing angel-w3" style="--rz: 120deg;"></div>
            <div class="angel-wing angel-w4" style="--rz: 180deg;"></div>
            <div class="angel-wing angel-w5" style="--rz: 240deg;"></div>
            <div class="angel-wing angel-w6" style="--rz: 300deg;"></div>
        </div>
    </div>
    <script src="angel.js"></script>
</body>
</html>
